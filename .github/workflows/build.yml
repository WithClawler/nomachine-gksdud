name: Windows packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      install_checks:
        description: Run the full non-administrator install/upgrade/uninstall checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$') { throw 'Invalid VERSION.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag must match VERSION.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Locate Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 compiler is required; installer builds cannot be skipped.' }
          "path=$compiler" >> $env:GITHUB_OUTPUT
          $info = (Get-Item -LiteralPath $compiler).VersionInfo
          if ($info.FileMajorPart -ne 6) { throw 'The build requires Inno Setup 6.' }
          Write-Output "Inno Setup compiler: $($info.FileVersion)"
      - name: Test and build installer, portable and source packages
        shell: pwsh
        env:
          ISCC_PATH: ${{ steps.inno.outputs.path }}
        run: ./tools/Build.ps1 -IsccPath $env:ISCC_PATH
      - name: Install, upgrade, relocate and uninstall as a standard user
        id: install
        if: startsWith(github.ref, 'refs/tags/v') || inputs.install_checks
        shell: pwsh
        run: ./tools/Test-Install.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-distribution
          path: |
            dist/NoMachineHangulBridge-${{ steps.version.outputs.version }}-windows-x64-setup.exe
            dist/NoMachineHangulBridge-${{ steps.version.outputs.version }}-windows-x64-portable.zip
            dist/NoMachineHangulBridge-${{ steps.version.outputs.version }}-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-installer
          path: |
            dist/*-windows-x64-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-portable
          path: |
            dist/*-windows-x64-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Summarize Windows distribution
        shell: pwsh
        run: |
          '## Windows x64 distribution' >> $env:GITHUB_STEP_SUMMARY
          'Installer EXE, portable ZIP, source ZIP and SHA256SUMS.txt passed package verification.' >> $env:GITHUB_STEP_SUMMARY
          'Artifacts: windows-x64-installer / windows-x64-portable / windows-distribution (all files).' >> $env:GITHUB_STEP_SUMMARY
          if ('${{ steps.install.outcome }}' -eq 'success') {
            'Non-administrator install, upgrade, relocation and uninstall checks passed.' >> $env:GITHUB_STEP_SUMMARY
          }

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-distribution
          path: dist
      - name: Verify downloaded packages and prepare release notes
        shell: python
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          import hashlib, os, pathlib, re
          version = os.environ['RELEASE_VERSION']
          root = pathlib.Path('dist')
          packages = {
              f'NoMachineHangulBridge-{version}-windows-x64-setup.exe',
              f'NoMachineHangulBridge-{version}-windows-x64-portable.zip',
              f'NoMachineHangulBridge-{version}-source.zip',
          }
          if {p.name for p in root.iterdir()} != packages | {'SHA256SUMS.txt'}:
              raise SystemExit('Release requires exactly the installer, portable, source and checksum files.')
          expected = {}
          for line in (root / 'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines():
              match = re.fullmatch(r'([0-9a-f]{64}) \*(.+)', line)
              if not match or match[2] not in packages or match[2] in expected:
                  raise SystemExit('Invalid or duplicate checksum entry.')
              expected[match[2]] = match[1]
          if set(expected) != packages:
              raise SystemExit('Missing release checksums.')
          for name, digest in expected.items():
              if hashlib.sha256((root / name).read_bytes()).hexdigest() != digest:
                  raise SystemExit(f'Checksum mismatch: {name}')
          changelog = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          marker = f'## {version}\n'
          if marker not in changelog:
              raise SystemExit('Current version is missing from CHANGELOG.md.')
          changes = changelog.split(marker, 1)[1].split('\n## ', 1)[0].strip()
          base = f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/v{version}'
          notes = f'''{changes}

          ### 다운로드
          - [Windows x64 설치형 EXE]({base}/NoMachineHangulBridge-{version}-windows-x64-setup.exe): 현재 사용자에게 설치, AutoHotkey runtime 포함.
          - [Windows x64 portable ZIP]({base}/NoMachineHangulBridge-{version}-windows-x64-portable.zip): 폴더에 풀어 Start.cmd로 실행.
          - [소스 ZIP]({base}/NoMachineHangulBridge-{version}-source.zip)
          - [SHA256SUMS.txt]({base}/SHA256SUMS.txt)

          업데이트 전 실행 중인 앱을 종료하세요. 저장된 한영키 설정은 유지됩니다. 서명되지 않은 alpha 빌드이며, 원격 Mac 실기 재검증 범위는 VALIDATION.md를 확인하세요.
          '''
          pathlib.Path('release-notes.md').write_text(notes, encoding='utf-8')
      - name: Upload, verify and publish installer and portable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            test "$(jq -r .isDraft release.json)" = true || { echo 'Existing release is public; refusing to replace its files.'; exit 1; }
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG · !한 UI" --notes-file release-notes.md "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release download "$RELEASE_TAG" --dir release-check
          test "$(find release-check -type f | wc -l)" -eq 4
          for file in dist/*; do cmp "$file" "release-check/$(basename "$file")"; done
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG · !한 UI" --notes-file release-notes.md --prerelease="$prerelease" --draft=false
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
